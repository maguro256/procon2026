; GEMMBA モジュールの ESP32 版。ラズパイ版（raspi/）と並行開発する。
; ビルド:   pio run
; 書き込み: pio run -t upload
; ログ:     pio device monitor

[platformio]
default_envs = gemmba

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 部品ごとの確認プログラムは各 env で個別にビルドする
build_src_filter = +<*> -<rc522_test.cpp> -<rc522_touch.cpp> -<mic_test.cpp> -<checkall.cpp> -<gemmba.cpp>



; レジスタを読み返して送り方・速度の合否を自動判定する（src/lcd_probe.cpp）
; 要: ILI9341 の SDO → GPIO19。pio run -e lcd_probe -t upload
[env:lcd_probe]
extends = env:esp32dev
build_flags = -DLCD_PROBE

; 自作コードを使わない確認: Adafruit_ILI9341 公式サンプル（graphicstest）をピンだけ合わせたもの
; pio run -e adafruit_test -t upload
[env:adafruit_test]
extends = env:esp32dev
build_flags = -DADAFRUIT_TEST -DLCD_PROBE
lib_deps =
    adafruit/Adafruit ILI9341
    adafruit/Adafruit GFX Library

; RC522 単体の動作確認（src/rc522_test.cpp）。pio run -e rc522_test -t upload
[env:rc522_test]
extends = env:esp32dev
build_src_filter = -<*> +<rc522_test.cpp>
lib_deps =
    miguelbalboa/MFRC522

; I2S マイク（INMP441 系）の動作確認（src/mic_test.cpp）。pio run -e mic_test -t upload
[env:mic_test]
extends = env:esp32dev
build_src_filter = -<*> +<mic_test.cpp>

; 全部品（RC522・マイク・ボタン・LED）を同時に動かす確認（src/checkall.cpp）
; pio run -e checkall -t upload
[env:checkall]
extends = env:esp32dev
build_src_filter = -<*> +<checkall.cpp>
lib_deps =
    miguelbalboa/MFRC522

; RC522 のタッチ反応確認。重ねた／離した瞬間を出す（src/rc522_touch.cpp）
; pio run -e rc522_touch -t upload
[env:rc522_touch]
extends = env:esp32dev
build_src_filter = -<*> +<rc522_touch.cpp>
lib_deps =
    miguelbalboa/MFRC522

; 本番（raspi/raspi.py の移植）。src/gemmba.cpp
; pio run -e gemmba -t upload   （default_envs なので pio run -t upload だけでもよい）
; Wi-Fi の SSID・パスワードは include/secrets.h（git に入れない。雛形は secrets.example.h）
; 日本語フォントが大きいので、OTA 無しでアプリ領域を 3MB にとる huge_app を使う
[env:gemmba]
extends = env:esp32dev
build_src_filter = -<*> +<gemmba.cpp>
board_build.partitions = huge_app.csv
lib_deps =
    miguelbalboa/MFRC522
    lovyan03/LovyanGFX
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7
